# Local / evaluation deployment: PostgreSQL + API + UI. Synthetic data only; no SAP connectivity.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sdtf
      POSTGRES_PASSWORD: sdtf
      POSTGRES_DB: sdtf
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U sdtf"], interval: 5s, retries: 10 }
  backend:
    build: { context: .., dockerfile: deploy/Dockerfile.backend }
    environment:
      SDTF_DATABASE_URL: postgresql+psycopg://sdtf:sdtf@postgres:5432/sdtf
      SDTF_AUTH_SECRET: ${SDTF_AUTH_SECRET:-change-me-in-production}
      SDTF_EVIDENCE_DIR: /app/data/evidence
      SDTF_STAGING_BACKEND: columnar
      SDTF_STAGING_DIR: /app/data/staging
      SDTF_CORS_ORIGINS: http://localhost:8080
      SDTF_ENV: compose
      SDTF_LOG_FORMAT: json
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}   # e.g. http://otel-collector:4318
      # Single sign-on (ADR-0012): register a public client with redirect URI http://localhost:8080/auth/callback
      SDTF_OIDC_ISSUER: ${SDTF_OIDC_ISSUER:-}            # e.g. https://idp.example.com/realms/sdtf
      SDTF_OIDC_JWKS_URL: ${SDTF_OIDC_JWKS_URL:-}        # e.g. https://idp.example.com/realms/sdtf/protocol/openid-connect/certs
      SDTF_OIDC_AUDIENCE: ${SDTF_OIDC_AUDIENCE:-sdtf-ui}
      SDTF_OIDC_ROLE_MAP: ${SDTF_OIDC_ROLE_MAP:-}        # e.g. {"SAP-Migration-Architects":"architect"}; empty = identical names
    volumes: ["evidence:/app/data"]
    depends_on: { postgres: { condition: service_healthy } }
    ports: ["8000:8000"]
  worker:
    build: { context: .., dockerfile: deploy/Dockerfile.backend }
    command: ["sh", "-c", "python -m sdtf.cli worker"]
    environment:
      SDTF_DATABASE_URL: postgresql+psycopg://sdtf:sdtf@postgres:5432/sdtf
      SDTF_AUTH_SECRET: ${SDTF_AUTH_SECRET:-change-me-in-production}
      SDTF_EVIDENCE_DIR: /app/data/evidence
      SDTF_STAGING_BACKEND: columnar
      SDTF_STAGING_DIR: /app/data/staging
      SDTF_DEV_USERS: "0"
      SDTF_LOG_FORMAT: json
      OTEL_SERVICE_NAME: sdtf-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    volumes: ["evidence:/app/data"]
    depends_on: [backend]
    deploy: { replicas: 2 }
  frontend:
    build: { context: .., dockerfile: deploy/Dockerfile.frontend }
    depends_on: [backend]
    ports: ["8080:80"]
volumes:
  pgdata: {}
  evidence: {}
