apiVersion: v1
kind: ConfigMap
metadata: { name: sdtf-config, namespace: sdtf }
data:
  SDTF_ENV: "kubernetes"
  SDTF_EVIDENCE_DIR: "/app/data/evidence"
  SDTF_EXTRACTION_WORKERS: "8"
  SDTF_STAGING_BACKEND: "columnar"
  SDTF_STAGING_DIR: "/app/data/staging"   # or s3://<bucket>/sdtf-staging (IRSA) / gs://<bucket>/sdtf-staging (Workload Identity)
  SDTF_STAGING_FS_OPTIONS: "{}"            # e.g. {"endpoint_url": "https://minio.internal"} for S3-compatible stores
  SDTF_JOB_LEASE_SECONDS: "600"
  SDTF_LOG_FORMAT: "json"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability.svc:4318"   # remove to disable export
  OTEL_SERVICE_NAME: "sdtf-api"
  SDTF_DEV_USERS: "0"
  SDTF_CORS_ORIGINS: "https://sdtf.example.internal"
---
apiVersion: v1
kind: Secret
metadata: { name: sdtf-secrets, namespace: sdtf }
type: Opaque
stringData:
  # Replace via your secrets manager (External Secrets / Vault CSI). Never commit real values.
  SDTF_DATABASE_URL: "postgresql+psycopg://sdtf:CHANGE_ME@postgres.sdtf.svc:5432/sdtf"
  SDTF_AUTH_SECRET: "CHANGE_ME"
