[project]
name = "rfactory"
version = "0.1.0"
description = "SAP Intelligent Refresh Factory - selective refresh, TDM and masking control plane"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6", "cryptography>=42", "pyjwt[crypto]>=2.8"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
test = ["pytest>=8", "httpx>=0.27", "psycopg[binary]>=3.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
